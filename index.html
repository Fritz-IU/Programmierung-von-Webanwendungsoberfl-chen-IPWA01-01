<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/UnCo.webp" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>KleiSper</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white">
      <div class="container-fluid d-flex align-items-center">
        <a class="navbar-brand" href="index.html">
          <img src="images/UnCo.webp" alt="KleiSper" width="35px" />
        </a>
        <div
          class="offcanvas offcanvas-end"
          tabindex="-1"
          style="width: 70%"
          id="offcanvas"
          aria-label="offcanvasLabel1"
        >
          <div class="offcanvas-header">
            <h4 class="offcanvas-title">Menü</h4>
            <button
              type="button"
              class="btn-close text-reset"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="index.html">Home</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  >News</a
                >
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Krisengebiete</a></li>
                  <li><a class="dropdown-item" href="#">Sammelfahrzeuge</a></li>
                  <li>
                    <a class="dropdown-item" href="#">News zu KleiSper</a>
                  </li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" href="#">Alle News</a></li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Meine Spenden</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Alle Spenden</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="d-flex ms-auto">
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Suche"
              aria-label="Search"
              style="width: 120px"
            />
            <button class="btn btn-link btn-outline-secondary" type="submit">
              <img src="images/search.svg" alt="Suchen" width="20px" />
            </button>
          </form>
          <button class="btn btn-link btn-outline-light">
            <img src="images/person-fill.svg" alt="Profil" width="20px" />
          </button>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvas"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <header></header>
    <main>
      <formular> </formular>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
